# Render Blueprint: one Docker web service in Singapore (next to Nexconn's SG data centre) on a Neon Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render asks once for every `sync: false` value.
# Migrations run on boot; GET /api/health is the health check. APP_URL defaults to RENDER_EXTERNAL_URL.
# Free tier: the web service sleeps after 15 min without traffic and takes about a minute to wake. Neon's free plan
# does not expire; its compute suspends after 5 idle minutes and resumes on the next query. The app keeps no state
# on local disk, so sleeping loses nothing: every show lives in Postgres and the round engine catches up on waking.
services:
  - type: web
    name: crowdplay
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Neon connection string (Singapore region, direct connection, ends in ?sslmode=require). Asked once.
      - key: DATABASE_URL
        sync: false
      - key: REALTIME_MODE
        value: nexconn
      - key: LLM_MODE
        value: live
      - key: INGEST_MODE
        value: dual
      - key: NEXCONN_PRIMARY_API_DOMAIN
        value: https://api.sg-light-api.com
      - key: NEXCONN_SECONDARY_API_DOMAIN
        value: https://api-b.sg-light-api.com
      # Read at build time (Dockerfile ARG) and inlined into the browser bundle; the App Key is public by design.
      - key: NEXT_PUBLIC_NEXCONN_AREA
        value: SG
      - key: NEXT_PUBLIC_REPO_URL
        value: https://github.com/Bhavya-Dhoot/crowdplay
      - key: OPENAI_FAST_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_REASONING_EFFORT
        value: none
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: alloy
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # Asked once when the Blueprint is created. NEXT_PUBLIC_NEXCONN_APP_KEY takes the same value as NEXCONN_APP_KEY.
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXT_PUBLIC_NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
